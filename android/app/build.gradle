plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.sopa1d.app'
    compileSdk 35

    defaultConfig {
        applicationId "cl.sopa1d.app"
        minSdk 24
        targetSdk 35
        versionCode 37
        versionName "1.9.27"
    }

    buildTypes {
        release {
            // APK personal: sin ofuscación para que los stack traces sean legibles
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// La web sigue viviendo en la raíz del repo: se copia a assets/ en cada build
// para que no existan dos copias desincronizadas de index.html.
tasks.register('copyWebAssets', Copy) {
    from("${rootDir}/..") {
        include 'index.html'
        include 'channels_spa.json'
        include 'series_genres.json'
        include 'chile.json'
        include 'hitster.json'
    }
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild') { dependsOn 'copyWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'

    // Pantalla de TV nativa: filas de carátulas y carga de imágenes
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.7.1'
    implementation 'androidx.media3:media3-ui:1.7.1'

    // Android no trae decodificador para audio MPEG-1/2 Layer II (audio/mpeg-L2),
    // que es justo lo que emiten estas señales IPTV: el vídeo se veía pero sin
    // sonido. Esta extensión aporta decodificadores FFmpeg (MP1/2/3, AC3, EAC3,
    // DTS...) para Media3. En el servidor esto lo resolvía ffmpeg con -c:a aac.
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.7.1-0.9.0'
}
